  phrase_original: "Haskenki tamkar hasken farin watane mai haskaka sararin samaniya"
  gloss_hint: "直訳は「あなたの美しさは、空を照らす満月の光のよう」。ハウサ語の恋愛フレーズ集を紹介するブログ記事に載っている口説き文句で、相手の美しさを夜空を照らす月光にたとえる比喩。同じ記事には相手を美しく活けられた花にたとえる言い回しや、恋を熱いお茶にたとえる表現も並んでいた。"
  kiza_elements: [metaphor, poetic_image]
