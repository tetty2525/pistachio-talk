candidate:
  phrase_original: "የኔ አንበሳ (Yene anbessa)"
  gloss_hint: "直訳は「私のライオン」。アムハラ語で男性の相手に対して使われる、動物の比喩を用いた詩的な親愛表現で、力強さと敬意・誇りを同時に伝える呼びかけ語とされる。同系統の表現として「私の女王（Yene nigist）」「私の王（Yene nigus）」なども存在し、王族・自然界の比喩で相手を讃える言い回しの一群をなす。"
  kiza_elements: [metaphor]
  sources:
    - url: https://ling-app.com/blog/i-love-you-in-amharic/
      note: "スカウトがfetch確認済み。原語表記「Yene anbessa（የኔ አንበሳ）」、「私のライオン」という意味と、男性への呼びかけとして力強さ・敬意を伝える詩的な親愛表現だという使用文脈の説明を確認した。"
