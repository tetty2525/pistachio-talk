teaser_ja: "愛する人を、陸に上がれない水中の生き物になぞらえて呼ぶ習わしがあるという噂。愛称の発想としてはかなり大胆な飛躍だが、この言語圏では至って一般的らしい。"
intrigue_tags: [animal_metaphor, whimsy, endearment]
candidate:
  phrase_original: "Рыбка моя"
  gloss_hint: "直訳は「私の小さな魚」。『рыбка（rybka）』は『рыба（魚）』の指小愛称形で、パートナーや子どもなど親しい相手への呼びかけ語として使われる。辞書系サイトでは『Russian words that used with partners, children and other loved ones』という文脈でこの語が紹介されており、恋人・子ども双方に向けた愛称であることが確認できる。実際の使用例としては『Вот и рыбка моя приплыла!（さあ、私の小さな魚が泳いで来たぞ！）』『Людмилка, рыбка моя единственная!（リュドミルカ、私の唯一の小さな魚よ！）』といった文学作品由来の呼びかけ文が確認できる。"
  kiza_elements: [metaphor, wit]
  sources:
    - url: https://www.omniglot.com/language/endearment/russian.htm
      note: "スカウトがfetch確認済み。『рыбка = little fish』という原語表記と訳、および『Russian words that used with partners, children and other loved ones』という使用場面の説明を確認した。"
