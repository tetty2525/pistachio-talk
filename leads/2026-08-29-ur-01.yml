candidate:
  phrase_original: "رَشْکِ قَمَر (rashk-e-qamar)"
  gloss_hint: "直訳は「月の嫉妬」。あまりの美しさに月ですら嫉妬する、という古典ウルドゥー詩（ガザル）の定番讃美表現。美しい恋人を指す呼びかけとしても使われる"
  kiza_elements: [poetic_image, cultural_allusion]
  sources:
    - url: https://www.rekhtadictionary.com/meaning-of-rashk-e-qamar
      note: "スカウトがfetch確認済み。ウルドゥー語原文『رَشْکِ قَمَر』の表記と『月への嫉妬』を意味する詩的表現である旨、詩人アマーナト・ラクナヴィーの一節『ghar mere shab ko jo wo rashk-e-qamar aa nikla, ho gae partaw-e-ruKH se dar o diwar safed』（その月も羨む美しい人が夜に私の家を訪れると、その顔の輝きで戸口も壁も白く輝いた）という使用例（couplet）を確認した。古典ウルドゥー詩の伝統で天体イメージを用いて至上の美を讃える定番表現であるとの説明も確認した。"
