teaser_ja: "王だけが被ることを許された頭飾りになぞらえ、大切な人を「自分の王冠」と呼ぶ習わしがあるという言語圏の噂。相手を自分の頭上に戴く、という発想の逆転が興味深い。"
intrigue_tags: [royalty, body_metaphor, cultural_allusion]
candidate:
  phrase_original: "Adé orí mi"
  gloss_hint: "直訳は「私の頭の上の王冠」。『adé（王冠）』はヨルバの伝統において王（オバ）のみが被ることを許された特別な頭飾りを指す語で、ビーズ細工の王冠には強い権威・栄誉の象徴性が伴う。これを恋人・配偶者への愛称として転用し『私を戴冠させてくれる人＝私の王冠』という含意で使う表現。ある解説サイトでは『the crown on my head (literal)/ one who enobles me』という語義が、別のヨルバ文化サイトでは『Ade Ori Mi（My Crown）』を配偶者への呼びかけとして紹介し『your man will highly be impressed when you call him this name because it shows you know his worth（相手の価値を理解していることが伝わる）』という使用場面の説明が確認できる。"
  kiza_elements: [metaphor, cultural_allusion]
