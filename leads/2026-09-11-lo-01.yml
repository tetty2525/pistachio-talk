  phrase_original: "ຮັກ / ຫັກ"
  gloss_hint: "ラオ語で「愛する」を意味する ຮັກ（huk）と「壊れる・折れる」を意味する ຫັກ（huk）は、綴りの一文字と声調だけが異なるほぼ同音異義語。あるラオ語文化サイトの記事は、この近さを『愛と壊れやすさはほんのわずかな違いしか隔てていないのかもしれない』という詩的な問いかけとして紹介している。直接の口説き文句ではないが、愛を語る際にこの音の近さそのものを気の利いた一言として引用できる。"
  kiza_elements: [wit, poetic_image]
