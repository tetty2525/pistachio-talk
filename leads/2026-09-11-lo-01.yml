    - url: https://www.legaciesofwar.org/post/lao-language-love-%E0%BA%AE-%E0%BA%81-and-heart-%E0%BB%83%E0%BA%88
      note: "スカウトがfetch確認済み。原語表記「ຮັກ（huk, love）」と「ຫັກ（huk, broken）」、一文字・声調のみの違いであることの説明文『The difference is a single letter... resulting in a tonal change』、および詩的な考察『Perhaps love and brokenness are never far apart, sometimes separated by only the smallest shift』という使用文脈を確認した。"
