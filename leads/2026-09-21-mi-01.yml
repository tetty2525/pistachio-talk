      note: "スカウトがfetch確認済み。原語『piki kōtuku』とその語義『darling, treasure, symbol of prestige and uniqueness』、用例『hei piki kōtuku ki ō rātau māhunga』を確認した。"
    - url: https://maoridictionary.co.nz/search?keywords=kotuku
      note: "スカウトがfetch確認済み。『kōtuku』が年一度しか飛来しない稀少な白鷺であること、『kōtuku rerenga tahi』が『滅多に来ない大切な客人』を指す比喩として使われること、および『piki kōtuku』への言及を確認した。"
