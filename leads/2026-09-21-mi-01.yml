teaser_ja: "一生に一度出会えるかどうかという稀少な白い渡り鳥の羽飾りになぞらえて、大切な相手を呼ぶ言葉があるという噂。『滅多に来ない客人』を讃える古い言い回しと同じ語源を持つらしい。"
