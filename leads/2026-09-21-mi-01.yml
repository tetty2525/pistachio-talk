candidate:
  phrase_original: "Piki kōtuku"
  gloss_hint: "『kōtuku（コトゥク＝シラサギ）』は年に一度、限られた場所にしか飛来しない稀少な白鷺で、『kōtuku rerenga tahi（一度きりの飛来の白鷺）』という言い回しは『滅多に訪れない、大切な客人』を指す比喩として使われる。『piki kōtuku』はその羽飾りを意味し、権威ある人物の頭に飾られたことから転じて『darling, treasure, symbol of prestige and uniqueness（愛しい人・宝・気高さと唯一無二であることの象徴）』という語義を持つ。マオリ語の権威辞書サイトの見出し語『darling』のページに、この語と用例『hei piki kōtuku ki ō rātau māhunga（彼らの頭への羽飾りとして）』が掲載されているのを確認し、さらに『kōtuku』の見出しページでもこの語と稀少な鳥としての文化的背景の説明を確認した。"
  kiza_elements: [metaphor, cultural_allusion]
