  phrase_original: "He pūnāwai kahe wale ke aloha"
  gloss_hint: "直訳は「愛は自由に湧き流れる泉である」。ハワイの伝統的な格言（ʻōlelo noʻeau）とされ、愛は強制されるものではなく、地下から湧き出る新鮮な水のように自然に、豊かに流れ出るものだという教えを表す。"
