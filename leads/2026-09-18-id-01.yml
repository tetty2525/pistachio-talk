candidate:
  phrase_original: "buah hati"
  gloss_hint: "直訳は「心臓（心）の果実」。インドネシア語公式辞典KBBIにも収録された慣用句で、(1)『jantung hati』（心臓、転じて掛け替えのない存在）、(2)『kekasih yang tercinta』（最愛の恋人）という意味を持つ。我が子や恋人など、自分にとって最も大切な存在を果実にたとえて呼ぶ表現。"
  kiza_elements: [metaphor]
  sources:
    - url: https://kbbi.web.id/buah
      note: "スカウトがfetch確認済み。インドネシア語公式辞典KBBIの『buah』項目内、複合語『buah hati』の語義として『jantung hati』『kekasih yang tercinta』の2つの意味が登録されていることを確認した。"
    - url: https://jembatanbahasa.com/indonesian-idioms/
      note: "スカウトがfetch確認済み。イディオム『buah hati』の意味を『beloved children（愛しい我が子）』と説明し、使用例文『Mereka terlihat lebih bahagia setelah kehadiran buah hati.』（buah hati＝我が子の誕生後、二人はより幸せそうに見える）を確認した。"
