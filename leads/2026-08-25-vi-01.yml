teaser_ja: "東南アジアのある言語圏には、恋人同士を衣服の小さな留め具の対や、空の雲と大地の山という決して離れない対比になぞらえる、対句仕立ての言い伝えがある。宮廷の書物ではなく、市井で歌い継がれてきた素朴な韻文らしい。"
