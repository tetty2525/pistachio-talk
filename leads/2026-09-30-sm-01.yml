  phrase_original: "E lele le toloa ae ma'au i le vai"
  gloss_hint: "「トロア（灰色ガモの一種）はどこまでも飛んでいくが、必ず水辺に帰る」という意味のサモアのことわざ。もともとは人生でどれほど遠くへ旅しても最終的に故郷に帰るという教えだが、『どんなに離れていても、必ずあなたのもとへ帰る』という誓いの比喩に転用できそうな型として紹介されている。"
