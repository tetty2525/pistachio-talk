      note: "スカウトがfetch確認済み。サモア語原文「E lele le toloa ae ma'au i le auvai」、直訳「トロアは遠くまで飛ぶが、必ず水辺に帰る」を確認。『人生がどこへ連れて行っても、最終的に故郷に帰るという意味を示す』という使用文脈の説明を確認した。"
