candidate:
  phrase_original: "月が綺麗ですね"
  gloss_hint: "直訳は「月が綺麗ですね」というだけの言葉だが、日本語では「愛している」を婉曲に伝える告白の決まり文句として使われる。文豪・夏目漱石が英語の『I love you』の訳語として生徒に教えたという逸話（真偽は不確か）が由来とされ、実際にデート中などで夜空・月を見ながら告白する場面で使われる。"
  kiza_elements: [cultural_allusion, poetic_image]
  sources:
