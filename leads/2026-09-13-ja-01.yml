      note: "スカウトがfetch確認済み。原文表記「月が綺麗ですね」、夏目漱石の逸話に由来する『I love you』の婉曲訳という意味の説明、デートで月を眺めながら告白する場面や、OK/NG時の返答例（「死んでもいいわ」等）という使用文脈の記述を確認した。"
