candidate:
  phrase_original: "چاند سا چہرہ (chāñd sā chehra)"
  gloss_hint: "直訳は「月のような顔」。ウルドゥー語・ヒンディー語の古典詩（シャーヤリー）で伝統的に使われる、比類ない美しさを讃える比喩表現。月を美・純粋さの象徴として相手の顔にたとえるだけでなく、詩の伝統ではしばしば「満月でさえあなたの顔の輝きの前では見劣りする」という具合に、月を引き合いに出してその美をさらに上回ると詠む発展形が好まれる。"
  kiza_elements: [metaphor, poetic_image]
  sources:
    - url: https://www.rekhtadictionary.com/meaning-of-chaand-saa-chehra
      note: "スカウトがfetch確認済み。原語表記（ウルドゥー語 چانْد سا چِہْرَہْ・ヒンディー語 चाँद सा चेहरा）と、「非常に美しい顔」を意味する定型的な美辞であるという説明を確認した。"
    - url: https://www.rekhta.org/top-20/chaand-shayari
      note: "スカウトがfetch確認済み。月を相手の顔の美しさにたとえ、時にその美が満月をも上回ると詠む古典ウルドゥー詩の一群（例: Iftikhar Naseemの一節「us ke chehre kī chamak ke sāmne saada lagā / āsmāñ pe chāñd puurā thā magar aadhā lagā」）を確認し、ロマンティックな文脈での実際の使用場面を確認した。"
