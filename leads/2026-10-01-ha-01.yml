  gloss_hint: "「私の胸の面に広がる砂糖」という趣旨。ハウサ語の恋愛詩『Barin Zuma（蜂蜜を離れて）』に登場する一節で、恋人の存在や愛情を、味覚的な甘さ（砂糖）に重ねて語る比喩として使われている。"
