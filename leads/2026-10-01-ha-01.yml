      note: "スカウトがfetch確認済み。ハウサ語原文『Sukari a shafin kirjina』の表記と、詩『BARIN ZUMA』中で心・愛情を砂糖や蜂蜜などの味覚的比喩で表現している文脈を確認した。原文と英訳が対になった恋愛詩集として掲載されている。"
