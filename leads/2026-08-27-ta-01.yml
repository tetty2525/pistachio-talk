candidate:
  phrase_original: "செம் புலப் பெயல் நீர் போல் அன்புடை நெஞ்சம் தாம் கலந்தனவே"
  gloss_hint: "赤い土に降る雨のように、愛に満ちた心は混ざり合った、という趣旨の一節（サンガム文学『クルントーハイ』第40番）"
  kiza_elements: [metaphor, poetic_image]
