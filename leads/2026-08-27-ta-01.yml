      note: "スカウトがfetch確認済み。タミル語原文と英訳が掲載されており、血縁も面識もない男女が『赤い土に降る雨』のように心を通わせたという比喩の意味の説明、および恋人が別れを前に相手の不安を払拭するために語る場面という使用文脈の記述が確認できた。"
