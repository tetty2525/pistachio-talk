teaser_ja: "南インドの古典詩の伝統には、二千年以上前に詠まれたとされる一節が伝わる。血のつながりも面識もなかった二人の心が、ある自然現象の組み合わせのように混ざり合ったとたとえる詩で、今も詞華集で読み継がれているらしい。"
