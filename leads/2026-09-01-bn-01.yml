  gloss_hint: "直訳は「人生とは花であり、そのための愛は蜜である」。人生を花に、愛をその花に不可欠な蜜にたとえ、愛が人生を成り立たせる本質的なものだと語る比喩表現。"
  kiza_elements: [metaphor]
