    - url: https://www.superprof.co.in/blog/best-love-quotes-in-bengali/
      note: "スカウトがfetch確認済み。ベンガル語原文「জীবন হল সেই ফুল যার জন্য ভালবাসা হল মধু」の項目で、意味『人生は花であり、愛はその蜜』という訳と、恋の言葉を集めた記事内での使用（愛の言葉として紹介）を確認した。"
