  phrase_original: "mutya"
  gloss_hint: "サンスクリット語で「真珠」を意味する語に由来するとされるタガログ語。原義は「宝石・護符・真珠」で、そこから転じて「最愛の人・いとしい人」を指す比喩的な愛称としても使われる。フィリピンの美人コンテストの称号（例: Mutya ng Pilipinas）にも用いられ、「貴重で守るべきもの」という含みを今なお帯びている。"
  kiza_elements: [metaphor, cultural_allusion]
