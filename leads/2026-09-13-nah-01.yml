  phrase_original: "In xōchitl, in cuīcatl"
  gloss_hint: "直訳は「花、歌」。ナワトル語（古代アステカの言語）の対句表現（ディフラシスモ）で、『花と歌』の2つを並べることで一つの概念＝『詩・詩的創作』を表す。古代ナワ族の宗教祭礼や、統治者・貴族・戦士・神官らの集いで詠まれ、花と詩と歌を司る神シュチピリに捧げられた詩的伝統に連なる表現とされる。"
