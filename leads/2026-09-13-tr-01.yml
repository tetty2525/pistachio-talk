      note: "スカウトがfetch確認済み。「Göz bebeğim」の綴りと「My pupil/My precious one」の訳、直訳が「my pupil」であること、瞳の中心＝かけがえのない存在という比喩の説明、恋人または子供に対して使われる愛称であるという使用場面の記述を確認した。"
