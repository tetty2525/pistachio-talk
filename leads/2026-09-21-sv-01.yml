candidate:
  phrase_original: "Skatten"
  gloss_hint: "『skatt（財宝・宝物）』の定形（後置冠詞形）。恋人やパートナーを『財宝』になぞらえて呼ぶ愛称で、ある解説サイトでは『in a relationship with a Swede』という文脈で紹介される『cutesy nicknames for a significant other』の一つとして挙げられ、相手に直接呼びかける際は定形接尾辞『-en』を付ける、という文法的な使い方の説明も確認できる。別のスウェーデン語ネイティブ向けサイトの『男の子向け』『女の子向け』双方の愛称リストにも『skatt』が挙がっており、性別を問わずパートナーへの愛称として使われることが確認できる。"
  kiza_elements: [metaphor]
