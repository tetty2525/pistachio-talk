  sources:
    - url: https://en.wikipedia.org/wiki/Medinilla_waterhousei
      note: "スカウトがfetch確認済み。原語由来『tagi me uci 'ea』(cry to be like her)の記載、族長の娘が禁じられた恋に泣いた涙から花が生まれたという伝説の説明、フィジー国花・50ドル紙幣への図案採用・民謡『Tagimoucia ga』での使用という文化的位置づけの記述を確認した。"
