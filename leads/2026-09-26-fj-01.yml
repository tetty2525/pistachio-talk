  phrase_original: "tagimoucia（語源: tagi me uci 'ea）"
  gloss_hint: "『彼女のように泣け』を意味する語句から名付けられたとされる、フィジーの国花タギモウシアの名。族長の娘が禁じられた恋に涙した、その涙から生まれたという伝説を持ち、一年に一度しか咲かない希少な花として民謡にも歌われる。相手を『一年に一度だけ咲く花』になぞらえる文化的暗喩として使いうる。"
