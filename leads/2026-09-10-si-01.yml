  gloss_hint: "直訳は「月のように、星のように」。シンハラ語の恋愛ソング『Sanda Sanda Wage』（歌手Kasun Kalhara）の冒頭部分で、恋人同士が互いを月・星・花にたとえながら『自分たちも同じようだ』と重ねていく一節。恋愛的な文脈で広く歌われ親しまれている表現。"
  kiza_elements: [metaphor, poetic_image]
