  phrase_original: "Laləm, sən mənim həyatımın baharısan."
  gloss_hint: "直訳は「私のチューリップよ、あなたは私の人生の春だ」。『laləm（私のチューリップ）』はアゼルバイジャン語で恋人への愛称として使われる語で、チューリップは同語圏の詩的な伝統において美しさや愛の象徴とされる自然のイメージ。相手を花にたとえた上で、さらに『人生の春』という季節の比喩まで重ねる口説き文句。"
