teaser_ja: "南部アフリカのある言語圏には、恋文の代わりにビーズの首飾りに色で想いを託す伝統があり、川辺での出会いの場面で相手の美しさを海辺の砂の白さにたとえて讃える、古典的な口説き文句が伝わっているという噂。"
