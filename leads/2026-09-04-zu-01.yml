  phrase_original: "Nkosazane Emhlophe Efana Nezihlabathi Zolwandle"
  gloss_hint: "直訳は「海の砂のように白く美しいお嬢さん」。伝統的な求婚の場面（川辺などでの出会い）で、女性の美しさを海辺の白い砂にたとえて讃える古典的な口説き文句とされる。"
  kiza_elements: [metaphor, poetic_image]
  sources:
    - url: https://emandulokingdom.wordpress.com/tag/praise-a-zulu-girl/
      note: "スカウトがfetch確認済み。ズールー語原文「Nkosazane Emhlophe Efana Nezihlabathi Zolwandle」が英訳「Beautiful you are, as white and pure as the sands of the sea」とともに掲載され、伝統的な求愛の場面（川辺での出会い）で使われた古典的な口説き文句であるという使用場面の記述を確認した。同ページには他にも複数のズールー語口説き文句（原文・英訳付き）と、ビーズの首飾りで求愛の意思を伝える文化的背景の説明が確認できた。"
