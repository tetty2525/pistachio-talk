# カバレッジの分母。目標言語リスト（約50件）を地域でグルーピングした手動管理ファイル。
# /dashboard がこれを分母に indexes/coverage.md・frontier.md を生成する。
# map_anchor は地図lite上でのその言語圏のおおよその重心（代表都市・地域）。

